<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>這邊也可以放名稱</title>
		<style>
			body{background:white;color:black;text-align:center;}
			header{margin:1%; background:#eaeaea;} <!--頁首-->
			nav{margin:1%; } <!--導覽列-->
			main{margin:1%; } <!--主要內容-->
			
			a:link{color:red;}
			a:visited{color:green;}
			a:active{color:blue;}
		</style>
	</head>
	<body>
		<header><h1>主要的名稱之類的</h1></header>
		<nav><h3>分類之類的</h3></nav>
		<main><h2>主要內容</h2>/main>
	</body>
</html>
